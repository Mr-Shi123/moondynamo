name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Verify moonc version (at least 0.10.16)
        run: |
          python3 - <<'PY'
          import re
          import subprocess

          output = subprocess.check_output(["moonc", "-v"], text=True).strip()
          match = re.search(r"\bv(\d+)\.(\d+)\.(\d+)", output)
          if match is None or tuple(map(int, match.groups())) < (0, 10, 16):
              raise SystemExit(f"moonc 0.10.16 or newer required, found: {output}")
          print(output)
          PY

      - name: Check (strict, JS target)
        run: moon check --target js --deny-warn

      - name: Check (native target)
        run: moon check --target native

      - name: Build (JS target)
        run: moon build --target js

      - name: Test (JS target)
        run: moon test --target js

      - name: End-to-end demo against the bundled mock fixture
        run: |
          node scripts/mock-dynamodb.mjs &
          sleep 2
          moon run cmd/main --target js
          kill %1
